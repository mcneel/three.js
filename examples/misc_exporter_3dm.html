<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - exporter - 3dm</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - exporter - 3dm">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/misc_exporter_3dm.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/misc_exporter_3dm.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - exporter - 3dm<br/>
			Rhinoceros 3D file export
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Rhino3dmExporter } from 'three/addons/exporters/3DMExporter.js';
			import { Line2 } from 'three/addons/lines/Line2.js';
			import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
			import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			let camera, scene, renderer;

			const params = {
				version: 8,
				rotateFromYUp: true,
				exportTo3dm: exportTo3dm
			};

			init();

			function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x303030 );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.name = 'Camera';
				camera.position.set( 7, 6, 11 );
				scene.add( camera ); // exported as a named view

				// one group per object type: each group becomes a Rhino layer

				const layer = ( name ) => {

					const group = new THREE.Group();
					group.name = name;
					scene.add( group );
					return group;

				};

				const lights = layer( 'Lights' );
				const shapes = layer( 'Meshes' );
				const lines = layer( 'Lines' );
				const pointClouds = layer( 'Points' );
				const batches = layer( 'Batched meshes' );
				const wideLines = layer( 'Wide lines' );

				const ambient = new THREE.AmbientLight( 0xffffff, 0.5 );
				ambient.name = 'Ambient';
				lights.add( ambient );

				const light = new THREE.DirectionalLight( 0xffffff, 2.5 );
				light.name = 'Sun';
				light.position.set( 3, 6, 4 );
				lights.add( light );

				// meshes

				const knot = new THREE.Mesh(
					new THREE.TorusKnotGeometry( 0.8, 0.3, 128, 16 ),
					new THREE.MeshStandardMaterial( { name: 'Metal', color: 0xe0a030, metalness: 0.8, roughness: 0.3 } )
				);
				knot.name = 'Knot';
				knot.position.set( - 2.5, 1.2, 0 );
				shapes.add( knot );

				const box = new THREE.Mesh(
					new THREE.BoxGeometry( 1.6, 1.6, 1.6 ),
					new THREE.MeshStandardMaterial( { name: 'Checker', map: createCheckerTexture() } )
				);
				box.name = 'Box';
				box.position.set( 0, 0.8, 0 );
				box.userData.note = 'userData becomes user strings';
				shapes.add( box );

				const cylinder = new THREE.Mesh(
					new THREE.CylinderGeometry( 0.7, 0.7, 2, 32 ),
					new THREE.MeshLambertMaterial( { name: 'Blue', color: 0x3070e0 } )
				);
				cylinder.name = 'Cylinder';
				cylinder.position.set( 2.5, 1, 0 );
				shapes.add( cylinder );

				// lines: a helix and the box's edges

				const helixPoints = [];

				for ( let i = 0; i <= 200; i ++ ) {

					const t = i / 200 * Math.PI * 6;
					helixPoints.push( new THREE.Vector3( Math.cos( t ) * 0.6, t / ( Math.PI * 6 ) * 2.5, Math.sin( t ) * 0.6 ) );

				}

				const helix = new THREE.Line( new THREE.BufferGeometry().setFromPoints( helixPoints ), new THREE.LineBasicMaterial( { color: 0xd02020 } ) );
				helix.name = 'Helix';
				helix.position.set( 0, 0, - 2.5 );
				lines.add( helix );

				const edges = new THREE.LineSegments( new THREE.EdgesGeometry( box.geometry ), new THREE.LineBasicMaterial( { color: 0xe0e0e0 } ) );
				edges.name = 'Box edges';
				edges.position.copy( box.position ).add( new THREE.Vector3( 0, 0, 2.5 ) );
				lines.add( edges );

				// points with colors

				const positions = [], colors = [];
				const color = new THREE.Color();

				for ( let i = 0; i < 400; i ++ ) {

					const t = i / 400;
					const angle = t * Math.PI * 8;
					positions.push( Math.cos( angle ) * ( 1 + t * 3 ), 0.02, Math.sin( angle ) * ( 1 + t * 3 ) );
					color.setHSL( t, 0.8, 0.5 );
					colors.push( color.r, color.g, color.b );

				}

				const pointsGeometry = new THREE.BufferGeometry();
				pointsGeometry.setAttribute( 'position', new THREE.Float32BufferAttribute( positions, 3 ) );
				pointsGeometry.setAttribute( 'color', new THREE.Float32BufferAttribute( colors, 3 ) );

				const points = new THREE.Points( pointsGeometry, new THREE.PointsMaterial( { size: 0.08, vertexColors: true } ) );
				points.name = 'Spiral';
				pointClouds.add( points );

				// a batched mesh: each geometry becomes a block, each instance a block reference

				const batch = new THREE.BatchedMesh( 7, 2000, 4000, new THREE.MeshStandardMaterial( { name: 'Batch', color: 0xc04080, roughness: 0.5 } ) );
				batch.name = 'Batch';
				batch.position.set( 0, 0.4, - 5 );
				batches.add( batch );

				const batchGeometries = [
					batch.addGeometry( new THREE.BoxGeometry( 0.7, 0.7, 0.7 ) ),
					batch.addGeometry( new THREE.SphereGeometry( 0.4, 24, 12 ) ),
					batch.addGeometry( new THREE.ConeGeometry( 0.4, 0.8, 24 ) )
				];

				const matrix = new THREE.Matrix4();

				for ( let i = 0; i < 7; i ++ ) {

					const instance = batch.addInstance( batchGeometries[ i % 3 ] );
					batch.setMatrixAt( instance, matrix.makeRotationY( i * 0.4 ).setPosition( ( i - 3 ) * 1.2, 0, 0 ) );

				}

				// a wide line: its width in pixels becomes the plot weight

				const wavePositions = [];

				for ( let i = 0; i <= 100; i ++ ) {

					const x = i / 100 * 7 - 3.5;
					wavePositions.push( x, 0.3 + Math.sin( x * 2 ) * 0.3, 4.5 );

				}

				const wave = new Line2( new LineGeometry().setPositions( wavePositions ), new LineMaterial( { color: 0x20b0d0, linewidth: 4 } ) );
				wave.name = 'Wave';
				wideLines.add( wave );

				//

				const gui = new GUI();
				gui.add( params, 'version', { 'Rhino 9': 9, 'Rhino 8': 8, 'Rhino 7': 7 } ).name( 'File version' );
				gui.add( params, 'rotateFromYUp' ).name( 'Rotate to Z-up' );
				gui.add( params, 'exportTo3dm' ).name( 'Export 3DM' );
				gui.open();

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 1, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function createCheckerTexture() {

				const canvas = document.createElement( 'canvas' );
				canvas.width = canvas.height = 128;

				const context = canvas.getContext( '2d' );

				for ( let y = 0; y < 8; y ++ ) {

					for ( let x = 0; x < 8; x ++ ) {

						context.fillStyle = ( x + y ) % 2 === 0 ? '#ffffff' : '#30a050';
						context.fillRect( x * 16, y * 16, 16, 16 );

					}

				}

				const texture = new THREE.CanvasTexture( canvas );
				texture.name = 'checker';
				texture.colorSpace = THREE.SRGBColorSpace;

				return texture;

			}

			async function exportTo3dm() {

				const exporter = new Rhino3dmExporter();
				exporter.setLibraryPath( 'https://cdn.jsdelivr.net/npm/rhino3dm@9.2.0-beta.1/' );

				const result = await exporter.parseAsync( scene, { version: params.version, rotateFromYUp: params.rotateFromYUp } );
				saveArrayBuffer( result, 'scene.3dm' );

			}

			const link = document.createElement( 'a' );
			link.style.display = 'none';
			document.body.appendChild( link );

			function save( blob, filename ) {

				link.href = URL.createObjectURL( blob );
				link.download = filename;
				link.click();

			}

			function saveArrayBuffer( buffer, filename ) {

				save( new Blob( [ buffer ], { type: 'application/octet-stream' } ), filename );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
